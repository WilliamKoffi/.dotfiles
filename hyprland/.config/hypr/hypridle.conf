general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Lock the session after 5 minutes idle.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off after 10 minutes idle (5 more after lock).
# Any input just wakes the display back up (on-resume); the session
# is never suspended or terminated by this daemon.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
