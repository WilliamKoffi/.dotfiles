general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = rgb(000000)
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(444444)
    inner_color = rgb(111111)
    font_color = rgb(dddddd)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 55
    position = 0, 160
    halign = center
    valign = center
}
